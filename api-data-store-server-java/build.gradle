evaluationDependsOn(':lib-json')

apply plugin: 'java'
apply plugin: 'application'

compileJava {
    options.compilerArgs << '-parameters'
}

compileTestJava {
    options.compilerArgs << '-parameters'
}

sourceCompatibility = JavaVersion.VERSION_21
targetCompatibility = JavaVersion.VERSION_21

apply from: '../build/repository.gradle'
repositories repositoryConfig

dependencies {
    compileOnly libs.org.projectlombok.lombok
    annotationProcessor libs.org.projectlombok.lombok
    implementation project(':lib-json'),
            project(':lib-two-phase-transaction'),
            libs.org.projectlombok.lombok
    testImplementation libs.org.junit.junit,
            libs.org.hamcrest.hamcrest.core
}
