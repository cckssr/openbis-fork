apply plugin: 'java'
apply plugin: 'application'

compileJava {
    options.compilerArgs << '-parameters'
}

sourceCompatibility = JavaVersion.VERSION_21
targetCompatibility = JavaVersion.VERSION_21

apply from: '../build/repository.gradle'
repositories repositoryConfig

configurations {
    tests.extendsFrom testImplementation
    tests.canBeResolved true
}

dependencies {
    annotationProcessor libs.org.projectlombok.lombok
    project(':lib-logging')
    implementation project(':lib-logging'),
            libs.org.projectlombok.lombok,
            libs.io.netty.netty.all.v4168final
    testImplementation libs.org.junit.junit,
            libs.org.hamcrest.hamcrest.core,
            libs.org.hamcrest.hamcrest.library
}


test {
    systemProperty "java.awt.headless", "true"
}
