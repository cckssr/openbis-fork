# prefix needed for setting service.properties from system properties or environment variables
system.property.prefix=afssftp.
logFactoryClass=ch.ethz.sis.shared.log.standard.impl.StandardLogFactory
afssftp.logging.configuration=logging.properties

serverPort=2222
applicationServerUrl=http://localhost:8888
afsUrl=http://localhost:8085/afs-server

keyStorePath=../server-sftp/dist/etc/sftp_keystore.jks
keyStorePassword=changeit
keyStoreKeyAlias=sftp

maxFileChannelsPerSession=20
maxAfsClientChunkSize=10485760
afsCacheTimeoutMillis=300