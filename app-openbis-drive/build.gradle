// Note: in development mode, the system-tray menu cannot start the graphical interface: use Gradle task
// 'openBISDevelopmentEnvironmentDriveGUIStart' instead
tasks.register('openBISDevelopmentEnvironmentDriveServerStart', JavaExec) {
    environment('OPENBIS_DRIVE_DEV_MODE','true')
    mainClass = 'ch.openbis.drive.DriveAPIService'
    classpath = sourceSets.main.runtimeClasspath
}

// Note: in development mode, the graphical interface cannot start the background process: use Gradle task
// 'openBISDevelopmentEnvironmentDriveServerStart' instead
tasks.register('openBISDevelopmentEnvironmentDriveGUIStart', JavaExec) {
    environment('OPENBIS_DRIVE_DEV_MODE','true')
    //environment('OPENBIS_DRIVE_LOCAL_DEVELOPMENT_AS_AND_AFS_URL','true') //see README.md
    mainClass = 'ch.openbis.drive.gui.Launcher'
    classpath = sourceSets.main.runtimeClasspath
}

// Launch with arguments, for example:
// > ./gradlew openBISDevelopmentEnvironmentDriveCommandLine --args=status
// > ./gradlew openBISDevelopmentEnvironmentDriveCommandLine --args='notifications --limit=5'
// Note: 'start' and 'stop' commands do not work in development mode: use Gradle task
// 'openBISDevelopmentEnvironmentDriveServerStart' instead
tasks.register('openBISDevelopmentEnvironmentDriveCommandLine', JavaExec) {
    environment('OPENBIS_DRIVE_DEV_MODE','true')
    mainClass = 'ch.openbis.drive.DriveAPICmdLineApp'
    classpath = sourceSets.main.runtimeClasspath
}


/////////////////////////////////////////////////////////////////////////////////////////
//MANUAL INSTALLATION RELEASE (useful for development or non-standard environments) /////
/////////////////////////////////////////////////////////////////////////////////////////
tasks.register('release', Tar) {
    dependsOn('copyInstallScripts')
    dependsOn('copyLaunchScripts')
    dependsOn('appOpenbisDriveFullJar')

    doFirst {
        copy {
            from('build/libs/') {
                rename(
                        filename -> filename.replace(
                                baseName + '-full-' + version + '.jar',
                                baseName + '-full.jar')
                )
            }
            into('build/manual-release/launch-scripts')
            include(baseName + '-full-' + version + '.jar')
        }
    }

    archiveFileName = baseName + '-' + implementationVersion+ ".tar.gz"

    from 'build/manual-release'
    compression = Compression.GZIP
}

tasks.register('layManualReleaseDirectoriesOut') {
    mkdir('build/manual-release')
    mkdir('build/manual-release/launch-scripts')
}

tasks.register('copyLaunchScripts', Copy) {
    dependsOn('layManualReleaseDirectoriesOut')
    from('launch-scripts')
    into('build/manual-release/launch-scripts')
}

tasks.register('copyInstallScripts', Copy) {
    dependsOn('layManualReleaseDirectoriesOut')
    from('install-scripts')
    into('build/manual-release')
}
