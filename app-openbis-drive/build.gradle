tasks.register('appOpenbisDriveFullJar', Jar) {
    zip64 = true;
    dependsOn('build')

    manifest {
        attributes(
                'Implementation-Title':   baseName + '-service',
                'Implementation-Version': implementationVersion,
                'Main-Class': 'ch.openbis.drive.DriveAPICmdLineApp'
        )
    }
    archiveBaseName = baseName + '-full'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from { configurations.runtimeClasspath.collect {
            it.isDirectory() ? it : (it.name.endsWith('.jar') ? zipTree(it) : it)
        }
    }
    with jar
}

tasks.register('copyFullJarToInstallerResources', Copy) {
    dependsOn('copyInstallerResources')
    dependsOn('appOpenbisDriveFullJar')

    from('build/libs/') {
        rename(
                filename -> filename.replace(
                            baseName + '-full-' + version + '.jar',
                            baseName + '-full.jar')
        )
    }
    into('build/release/installer-resources/include')
    include(baseName + '-full-' + version + '.jar')
}

//NB: VERY IMPORTANT NOTE ABOUT implementationVersion !!!
//If the value of implementationVersion is of the form: SNAPSHOT+1777017722
//jpackage fails.
//Accepted formats are for example:
//- 1.0.0
//- 1.0.0-SNAPSHOT
//- 1.0.0-SNAPSHOT+1777017722
tasks.register('jpackageOnLinux', Exec) {
    dependsOn('copyFullJarToInstallerResources')

    workingDir = 'build/release/installer-resources'
    commandLine = [
        'jpackage',
        '-i', 'include',
        '-d', 'include',
        '-n', 'openbis-drive',
        '--main-class', 'ch.openbis.drive.ProxyLauncher',
        '--main-jar', baseName + '-full.jar',
        '--icon', 'openbis-drive-icon-small.png',
        '--app-version', implementationVersion,
        '--description', 'Synchronization tool for openBIS',
        '--linux-shortcut'
    ]

    doLast {
        copy {
            from('build/release/installer-resources/include')
            include('README.md', 'openbis-drive*' + implementationVersion + '*.deb')
            into('build/release/installer-release')
        }
    }
}

tasks.register('releaseOnLinux', Tar) {
    dependsOn('jpackageOnLinux')

    archiveFileName = baseName + '-' + implementationVersion+ '-linux.tar.gz'

    from 'build/release/installer-release'
    compression = Compression.GZIP
}

