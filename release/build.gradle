def md5BaseDir = layout.buildDirectory.dir("tmp/md5")

tasks.register('generateMd5Files') {
    dependsOn(
            project(':api-openbis-java').tasks.release,
            project(':api-openbis-java').tasks.releaseDependenciesIncluded,
            project(':api-openbis-javascript').tasks.release,
            project(':api-openbis-python3-pybis').tasks.release,

            project(':app-openbis-command-line').tasks.release,
            project(':app-openbis-installer').tasks.release,
            project(':app-openbis-drive').tasks.release,

            project(':server-application-server').tasks.javadocTar,
            project(':server-application-server').tasks.dynamicApiJavadocTar,
            project(':server-original-data-store').tasks.javadocTar,
            project(':server-original-data-store').tasks.dropboxJavadocTar
    )

    doLast {
        def md = MessageDigest.getInstance("MD5")

        def writeMd5 = { File file, String subDir ->
            md.reset()
            file.withInputStream { is ->
                byte[] buffer = new byte[8192]
                int read
                while ((read = is.read(buffer)) != -1) {
                    md.update(buffer, 0, read)
                }
            }

            def hash = md.digest().encodeHex().toString()

            def outDir = new File(md5BaseDir.get().asFile, subDir)
            outDir.mkdirs()

            def outFile = new File(outDir, file.name + ".md5")
            outFile.text = "${hash}  ${file.name}"
        }

        // API
        [
                project(':api-openbis-java').tasks.release.archiveFile.get().asFile,
                project(':api-openbis-java').tasks.releaseDependenciesIncluded.archiveFile.get().asFile,
                project(':api-openbis-javascript').tasks.release.archiveFile.get().asFile,
                project(':api-openbis-python3-pybis').tasks.release.archiveFile.get().asFile
        ].each { writeMd5(it, "api") }

        // APP
        [
                project(':app-openbis-command-line').tasks.release.archiveFile.get().asFile,
                project(':app-openbis-installer').tasks.release.archiveFile.get().asFile,
                project(':app-openbis-drive').tasks.release.archiveFile.get().asFile
        ].each { writeMd5(it, "app") }

        // JAVADOC
        [
                project(':server-application-server').tasks.javadocTar.archiveFile.get().asFile,
                project(':server-application-server').tasks.dynamicApiJavadocTar.archiveFile.get().asFile,
                project(':server-original-data-store').tasks.javadocTar.archiveFile.get().asFile,
                project(':server-original-data-store').tasks.dropboxJavadocTar.archiveFile.get().asFile
        ].each { writeMd5(it, "javadoc") }
    }
}

tasks.register('release', Tar) {
    compression = Compression.GZIP
    // API
    dependsOn([project(':api-openbis-java').tasks.release,
               project(':api-openbis-java').tasks.releaseDependenciesIncluded,
               project(':api-openbis-javascript').tasks.release,
               project(':api-openbis-python3-pybis').tasks.release
    ])
    // APP
    dependsOn([project(':app-openbis-command-line').tasks.release,
               project(':app-openbis-drive').tasks.release,
               project(':app-openbis-installer').tasks.release
    ])
    //JAVADOC
    dependsOn([':server-application-server:javadocTar',
               ':server-application-server:dynamicApiJavadocTar',
               ':server-original-data-store:javadocTar',
               ':server-original-data-store:dropboxJavadocTar'
    ])
    //MD5
    dependsOn tasks.named('generateMd5Files')

    archiveFileName = "openbis-release-${version}.tar.gz"
    destinationDirectory = layout.buildDirectory.dir(".")


    from([project(':api-openbis-java').tasks.release.archiveFile,
          project(':api-openbis-java').tasks.releaseDependenciesIncluded.archiveFile,
          project(':api-openbis-javascript').tasks.release.archiveFile,
          project(':api-openbis-python3-pybis').tasks.release.archiveFile
    ]) {
        into 'api'
    }
    from(md5BaseDir) {
        into ''
        include 'api/**'
    }

    from([project(':app-openbis-command-line').tasks.release.archiveFile,
          project(':app-openbis-installer').tasks.release.archiveFile,
          project(':app-openbis-drive').tasks.release.archiveFile
    ]) {
        into 'app'
    }
    from(md5BaseDir) {
        into ''
        include 'app/**'
    }

    from([project(':server-application-server').tasks.javadocTar.archiveFile,
          project(':server-application-server').tasks.dynamicApiJavadocTar.archiveFile,
          project(':server-original-data-store').tasks.javadocTar.archiveFile,
          project(':server-original-data-store').tasks.dropboxJavadocTar.archiveFile
    ]) {
        into 'javadoc'
    }
    from(md5BaseDir) {
        into ''
        include 'javadoc/**'
    }
}

//
// Version Management
//

def semverToPep440(String version) {
    if (!version) return null

    def v = version.trim()

    // Split build metadata (+...)
    def parts = v.split('\\+', 2)
    def main = parts[0]
    def build = parts.length > 1 ? parts[1] : null

    // Split pre-release (-...)
    def mainParts = main.split('-', 2)
    def base = mainParts[0]
    def pre = mainParts.length > 1 ? mainParts[1] : null

    def pep = base

    if (pre) {
        def lower = pre.toLowerCase()

        // SNAPSHOT → dev0
        if (lower == 'snapshot') {
            pep = "${base}.dev0"
        }
        // dev.X → .devX
        else if (lower.startsWith('dev.')) {
            def n = lower.replace('dev.', '')
            pep = "${base}.dev${n}"
        }
        // alpha.X → aX
        else if (lower.startsWith('alpha.')) {
            def n = lower.replace('alpha.', '')
            pep = "${base}a${n}"
        }
        // beta.X → bX
        else if (lower.startsWith('beta.')) {
            def n = lower.replace('beta.', '')
            pep = "${base}b${n}"
        }
        // rc.X → rcX
        else if (lower.startsWith('rc.')) {
            def n = lower.replace('rc.', '')
            pep = "${base}rc${n}"
        }
        // fallback: treat unknown as dev
        else {
            pep = "${base}.dev0"
        }
    }

    // Append build metadata (PEP 440 local version)
    if (build) {
        pep = "${pep}+${build}"
    }

    return pep
}

def execute_working_dir(command, arguments, working_dir) {
    new ByteArrayOutputStream().withStream { os ->
        print "execute: ${command}"
        arguments.collect({print " ${it}"})
        println ''
        def result = exec {
            executable = command
            args = arguments
            standardOutput = os
        }
        return os.toString().split('\n')
    }
}

def isGitProject() {
    return new java.io.File(projectDir, ".git").isDirectory() || new java.io.File(projectDir, "../.git").isDirectory()
}

def calculateBuildInfo() {
    if (isGitProject()) {
        def gitlogoutput = execute_working_dir('git', ['log', '-1', '--format=%at'],  "../.git")
        project.ext.revisionNumber = Integer.parseInt(gitlogoutput[0])
    } else {
        project.ext.revisionNumber = 1
    }
    System.setProperty("revision", "" + project.ext.revisionNumber);

    if(System.getProperty("version") != null) {
        project.ext.versionNumber = System.getProperty("version");
    } else {
        project.ext.versionNumber = 'SNAPSHOT'
    }
    project.ext.pep440VersionNumber = semverToPep440(project.ext.versionNumber);
    System.setProperty("version", project.ext.versionNumber)

    project.version =  project.ext.versionNumber + '+' + project.ext.revisionNumber
    System.setProperty("version+revision", project.version)
}

calculateBuildInfo()