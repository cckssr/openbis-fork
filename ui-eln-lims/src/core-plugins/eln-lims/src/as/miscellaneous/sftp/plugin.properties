#
# Port of the server-sftp server. Clients (e.g. the "SFTP Link" in the Files widget) read it via
# getServerPublicInformation() to build sftp:// links; the host is taken from the browser's hostname.
# Default value: 2222
server-public-information.sftp-port=${eln-lims.as.miscellaneous.sftp.sftp-port:2222}
