plugins {
    id 'java'
    id 'application'
    alias(libs.plugins.io.quarkus)
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

tasks.withType(JavaCompile) {
    options.compilerArgs << '-parameters'
}

apply from: '../build/repository.gradle'
repositories repositoryConfig

apply from: '../build/common-resolutions.gradle'

configurations.all {
    exclude group: 'reflections', module: 'reflections'
    exclude group: "org.jboss", module: "jandex"
}

configurations.matching { it.name.startsWith("quarkus") }.configureEach {
    // BOM/POM-only artifacts must be excluded from Quarkus configurations because the Quarkus
    // Gradle plugin (3.23.0) tries to open all classpath entries as JARs without checking
    // if they are valid ZIP files.
    exclude group: "io.quarkus", module: "quarkus-bom"
    exclude group: "com.fasterxml.jackson", module: "jackson-bom"
    exclude group: "org.junit", module: "junit-bom"
    exclude group: "org.hibernate", module: "hibernate-core"
}

// Ivy repositories don't set the artifactType Gradle attribute that Quarkus's Gradle plugin
// requires (it calls getType().equals("jar") without a null check). This rule adds it to any
// variant missing it. Maven-resolved artifacts already have this attribute set and are unaffected.
dependencies.components.all { ComponentMetadataDetails details ->
    details.withVariant("default") {
        def artifactTypeAttr = Attribute.of("artifactType", String)
        attributes {
            if (getAttribute(artifactTypeAttr) == null) {
                attribute(artifactTypeAttr, "jar")
            }
        }
        if (!isPomOnlyArtifact(details.id)) {
            withFiles {
                removeAllFiles()
                addFile("${details.id.name}-${details.id.version}.jar")
            }
        }
    }
}

boolean isPomOnlyArtifact(ModuleVersionIdentifier id) {
    return (id.group == "io.quarkus" && id.name == "quarkus-bom") ||
            (id.group == "com.fasterxml.jackson" && id.name == "jackson-bom") ||
            (id.group == "org.junit" && id.name == "junit-bom")
}

dependencies {
    annotationProcessor libs.org.projectlombok.lombok

    implementation libs.org.projectlombok.lombok,
            project(':lib-logging'),
            project(':lib-ro-crate'),
            project(':lib-mail'),
            project(':api-openbis-java'),
            project(':app-ro-crate-openbis')


    // Quarkus
    implementation enforcedPlatform(libs.io.quarkus.quarkus.bom) // Any dependencies coming from quarkus take precedence
    implementation libs.io.quarkus.quarkus.resteasy
    implementation libs.org.reactivestreams.reactive.streams

    // Ro-crate library
    implementation libs.edu.kit.datamanager.ro.crate.java,
            libs.com.fasterxml.jackson.core.jackson.core,
            libs.com.fasterxml.jackson.core.jackson.databind,
            libs.com.fasterxml.jackson.core.jackson.annotations,
            libs.com.networknt.json.schema.validator,
            libs.net.lingala.zip4j.zip4j,
            libs.io.smallrye.jandex,
            libs.org.eclipse.jetty.jetty.client,
            libs.org.apache.commons.commons.compress

    testImplementation libs.org.testng.testng,
            libs.org.junit.junit,
                        libs.io.rest.assured.rest.assured
    testImplementation project(':app-ro-crate-openbis')
}

test {
    useTestNG() {
        suites 'src/test/resources/testng.xml'
    }
}

mainClassName = "ch.ethz.sis.rocrateserver.startup.StartupMain"

compileQuarkusGeneratedSourcesJava.dependsOn(compileJava)

["quarkusAppPartsBuild", "quarkusGenerateCode", "quarkusDependenciesBuild"].each { taskName ->
    tasks.named(taskName) {
        // Quarkus reads runtime artifacts while building its application model.
        dependsOn(configurations.runtimeClasspath.buildDependencies)
    }
}

task openBISDevelopmentEnvironmentROSStart(type: JavaExec) {
    mainClass = mainClassName
    classpath = sourceSets.main.runtimeClasspath
    environment "RO_CRATE_SERVER_LOCAL_DOWNLOAD_PORT", "8100"
    args(["../server-ro-crate/src/main/resources/service.properties"])
    jvmArgs(['--add-opens=java.base/jdk.internal.misc=ALL-UNNAMED',
             '--add-opens=java.base/java.nio=ALL-UNNAMED',
             '-Dio.netty.tryReflectionSetAccessible=true',
             '-Xmx512M', '-ea'])
}

jar {
    manifest {
        attributes(
            'Main-Class': mainClassName
        )
    }
}

task RoCrateServerZip(type: Zip, dependsOn: quarkusBuild) {
    archiveBaseName = 'server-ro-crate'
    from('build/quarkus-app') {
        exclude '**/*-sources.jar'
        exclude '**/*-javadoc.jar'
        into 'server-ro-crate/quarkus-app'
    }
    from('dist') {
        into 'server-ro-crate/'
    }
}

compileQuarkusGeneratedSourcesJava.dependsOn(compileJava)
