tasks.register('clean', Delete) {
    delete 'build'
}

tasks.register('release', Tar) {
    dependsOn tasks.clean
    destinationDirectory = layout.buildDirectory.dir(".")
    def contentOfProjectFile = file('src/python/pyproject.toml').text
    def pybisVersion = (contentOfProjectFile =~ /(?m)^version\s*=\s*"([^"]+)"/)[0][1]
    archiveFileName = 'openbis-python3-api-' + pybisVersion + '.tar.gz'
    from 'src'
}


