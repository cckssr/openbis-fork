// openbis-java-api-javadoc
javadoc {
    dependsOn sourcesJar
    // Mirror the core-plugin-openbis pattern: use zipTree(archive).matching{} so the
    // filter is applied per-archive before sources are merged, and set sourcepath=""
    // so Javadoc cannot auto-discover the third-party source JARs on the classpath.
    source = zipTree(sourcesJar.archiveFile).matching {
        include "**/*.java"
    }
    options.addStringOption("sourcepath", "")
    destinationDir = file("$buildDir/docs/"+baseName+"-javadoc")
}


