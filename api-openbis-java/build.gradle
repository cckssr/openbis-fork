                include "ch/systemsx/cisd/common/exceptions/**/*.class"
                include "ch/systemsx/cisd/common/spring/HttpInvokerUtils.class"
                include "ch/systemsx/cisd/common/spring/IRemoteSpringBeanProvider.class"
