############################################################
# ServiceCallHandler Handler
############################################################
ServiceCallHandler.class = ch.systemsx.cisd.openbis.common.log.ServiceCallAppender
ServiceCallHandler.logFileName = log/datastore_server_service_calls.log
ServiceCallHandler.level = INFO
ServiceCallHandler.messagePattern = %d %-5p [%t] %c - %m%n

############################################################
# LongRunningThreadHandler Handler
############################################################
LongRunningThreadHandler.class = ch.ethz.sis.shared.log.standard.handlers.DailyRollingFileHandler
LongRunningThreadHandler.logFileName = log/datastore_server_long_running_threads.log
LongRunningThreadHandler.level = INFO
LongRunningThreadHandler.messagePattern = %d %-5p [%t] %c - %m%n

############################################################
# SqlErrorCodesFactoryHandler Handler
############################################################
SqlErrorCodesFactoryHandler.class = ch.ethz.sis.shared.log.standard.handlers.DailyRollingFileHandler
SqlErrorCodesFactoryHandler.logFileName = log/datastore_server_sql_error_codes_factory.log
SqlErrorCodesFactoryHandler.level = INFO
SqlErrorCodesFactoryHandler.messagePattern = %d %-5p [%t] %c - %m%n

############################################################
# DbConnectionsHandler Handler
############################################################
DbConnectionsHandler.class = ch.systemsx.cisd.dbmigration.logging.DbConnectionLogHandler
DbConnectionsHandler.logFileName = log/datastore_server_db_connections.log
DbConnectionsHandler.level = INFO
DbConnectionsHandler.messagePattern = %d %-5p [%t] %c - %m%n

############################################################
# Per?logger assignments (mirroring your <category> mapping)
############################################################
# MACHINE.MonitoringPoolingDataSource ? DbConnectionsHandler
MACHINE.MonitoringPoolingDataSource.level = INFO
MACHINE.MonitoringPoolingDataSource.handlerAliases = DbConnectionsHandler

# NOTIFY = DefaultFileHandler + EMAIL
NOTIFY.level = INFO
NOTIFY.handlerAliases = DefaultFileHandler

#NOTIFY.handlerAliases = DefaultFileHandler,EMAIL

# TRACKING = ServiceCallHandler
TRACKING.level = INFO
TRACKING.handlerAliases = ServiceCallHandler

# ACCESS = ServiceCallHandler
ACCESS.level = INFO
ACCESS.handlerAliases = ServiceCallHandler

# ACCESS.LongRunningThreadLogger = LongRunningThreadHandler
ACCESS.LongRunningThreadLogger.level = INFO
ACCESS.LongRunningThreadLogger.handlerAliases = LongRunningThreadHandler

# org.springframework.jdbc.support.SQLErrorCodesFactory = SqlErrorCodesFactoryHandler
org.springframework.jdbc.support.SQLErrorCodesFactory.level = INFO
org.springframework.jdbc.support.SQLErrorCodesFactory.handlerAliases = SqlErrorCodesFactoryHandler


############################################################
# Special BioFormats log filters
############################################################
loci.formats.in.level = WARN
loci.formats.FormatHandler.level = ERROR
