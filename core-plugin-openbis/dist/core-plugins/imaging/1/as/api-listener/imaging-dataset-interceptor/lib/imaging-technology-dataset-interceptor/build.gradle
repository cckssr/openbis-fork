plugins {
    id "com.github.node-gradle.node" version "7.1.0"
}

apply from: 'javaproject.gradle'
apply from: 'repository.gradle'


dependencies {
    api project(':api-openbis-java'),
            project(':server-original-data-store')

    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.18.3',
            'com.fasterxml.jackson.core:jackson-core:2.18.3',
            'com.fasterxml.jackson.core:jackson-databind:2.18.3',
            'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.18.3'

    testImplementation 'junit:junit:4.10',
            'testng:testng:6.8-CISD'

    testRuntimeOnly 'hamcrest:hamcrest-core:1.3',
            project(':server-original-data-store')
}

sourceSets {
    main {
        resources {
            srcDirs = ['source/java/*']
        }
    }
    test {
        resources {
            srcDirs = ['sourceTest/java']
        }
    }
}


def premiseArchiveName = 'imaging-dataset-interceptor.jar'
jar {
    dependsOn compileJava
    archiveFileName = premiseArchiveName
    includeEmptyDirs false
}


tasks.register('imagingDatasetInterceptorJar', Copy) {
    dependsOn jar
    from("${project.buildDir}/libs/${premiseArchiveName}")
    into ".."
}







