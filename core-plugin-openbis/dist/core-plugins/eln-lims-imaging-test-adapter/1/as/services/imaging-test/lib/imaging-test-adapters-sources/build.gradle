plugins {
    alias(libs.plugins.com.github.node.gradle.node)
}

apply from: 'javaproject.gradle'
apply from: 'repository.gradle'


dependencies {

    api files("../../../../../../../imaging/1/as/services/imaging/lib/openBIS-imaging-technology.jar")

    implementation libs.com.fasterxml.jackson.core.jackson.annotations,
            libs.com.fasterxml.jackson.core.jackson.core,
            libs.com.fasterxml.jackson.core.jackson.databind,
            libs.com.fasterxml.jackson.datatype.jackson.datatype.jsr310

    testImplementation libs.org.junit.junit,
            libs.org.testng.testng

    testRuntimeOnly libs.org.hamcrest.hamcrest.core

}

sourceSets {
    main {
        resources {
            srcDirs = ['source/java/*']
        }
    }
    test {
        resources {
            srcDirs = ['sourceTest/java']
        }
    }
}


def adaptersName = 'imaging-test-adapters.jar'
jar {
    dependsOn compileJava
    archiveFileName = adaptersName
    includeEmptyDirs false
}


tasks.register('adaptersJar', Copy) {
    dependsOn jar
    from("${project.buildDir}/libs/${adaptersName}")
    into ".."
}
