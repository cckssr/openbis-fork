plugins {
    alias(libs.plugins.com.github.node.gradle.node)
}

apply from: 'javaproject.gradle'


dependencies {
    api project(':api-openbis-java'),
            project(':server-original-data-store')

    implementation libs.com.fasterxml.jackson.core.jackson.annotations,
            libs.com.fasterxml.jackson.core.jackson.core,
            libs.com.fasterxml.jackson.core.jackson.databind,
            libs.com.fasterxml.jackson.datatype.jackson.datatype.jsr310

    testImplementation libs.org.junit.junit,
            libs.org.jmock.jmock,
            libs.org.testng.testng

    testRuntimeOnly libs.org.hamcrest.hamcrest.core,
            project(':server-original-data-store')
}

sourceSets {
    main {
        resources {
            srcDirs = ['source/java/*']
        }
    }
    test {
        resources {
            srcDirs = ['sourceTest/java']
        }
    }
}


def roCrateExamplesJar = 'openBIS-ro-crate-examples.jar'

// Dependencies for Jar
configurations.create('apiDependenciesIncluded')
dependencies {
    apiDependenciesIncluded project(':api-openbis-java'),
            project(':server-application-server'),
            project(':lib-commonbase'),
            project(':lib-logging'),
            project(':server-original-data-store')
}

jar {
    dependsOn compileJava
    duplicatesStrategy 'include'
    archiveFileName = roCrateExamplesJar
    includeEmptyDirs false
    from sourceSets.main.allSource
    finalizedBy('releaseRoCrateExamples')
}

tasks.register('releaseRoCrateExamples', Copy) {
    dependsOn jar
    from("${project.buildDir}/libs/${roCrateExamplesJar}")
    into ".."
}
