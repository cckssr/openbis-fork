buildscript {
    apply from: '../build/repository.gradle'

    repositories repositoryConfig

    dependencies {
        classpath(libs.org.owasp.dependency.check.gradle)
    }
}

apply from: '../build/javaproject.gradle'

apply plugin : 'org.owasp.dependencycheck'

dependencyCheck {
    nvd {
        apiKey = System.getenv('OWASP_NVD_APIKEY')
    }
    failBuildOnCVSS = 7 // 0 - 4 = low, 4 - 7 = medium, 7 - 9 = high, 9-10 = critical
    suppressionFile = "../owasp/owasp_suppressing_false_positives.xml"
    analyzers {
        // Disable .NET Assembly Analyzer, .dll, .exe
        assemblyEnabled = false
        // Disable JavaScript / Node.js related analyzers
        nodeEnabled = false        // disables Node.js package.json analyzer
        nodeAuditEnabled = false   // disables npm audit analyzer
        retirejs.enabled = false

        // Keep Java analyzers enabled (these are on by default)
        jarEnabled = true
        centralEnabled = true
    }
//    HTML – Human-readable report (most commonly used)
//    XML – Machine-readable XML output
//    JSON – Structured JSON (good for automation / parsing)
//    CSV – Spreadsheet-friendly format
//    JUNIT – JUnit-style report (useful for CI test result parsing)
//    SARIF – Static Analysis Results Interchange Format (used by GitHub, Azure DevOps, etc.)
//    ALL – Generates every supported format
    formats = ['HTML', 'CSV', 'JSON']
    // outputDirectory = "${buildDir}/reports/dependency-check"

    // Share DB across modules
    data {
        directory = "${projectDir}/.dependency-check-data"
    }
    // Keep test-only dependencies out of the report without suppressing the
    // same artifacts if they are introduced on a production classpath.
    skipTestGroups = true
    skipConfigurations = ["testRuntimeClasspath", "testCompileClasspath"]
    // scanConfigurations = ["runtimeClasspath"]
    proxy {
        server = 'proxy.ethz.ch'
        port = 3128
    }
    scanProjects = [
            ":lib-logging",
            ":lib-commonbase",
            ":lib-common",
            ":api-openbis-java",
            ":lib-openbis-commonbase",
            ":lib-openbis-common",
            ":lib-openbis-messages",
            ":lib-authentication",
            ":lib-db",
            ":lib-dbmigration",
            ":lib-messages-db",
            ":lib-pathinfo-db",
            ":lib-pathinfo",
            ":lib-mail",
            ":lib-maintenance",
            ":lib-compress",
            ":lib-shuffling",
            ":lib-folder-monitor",
            ":lib-data-store-commonbase",
            ":lib-data-store-common",
            ":lib-hdf5",
            ":lib-hierarchical-content",
            ":lib-archiver-db",
            ":lib-archiver",
            ":lib-two-phase-transaction",
            ":server-application-server",
            ":server-original-data-store",
            ":server-screening",
            ":core-plugin-openbis",
            ":app-openbis-installer",
            ":lib-image-readers",
            ":test-api-openbis-javascript",
            ":server-external-data-store",
            ":ui-admin",
            ":lib-microservice-server",
            ":lib-transactional-file-system",
            ":server-data-store",
            ":ui-eln-lims",
            ":api-openbis-javascript",
            ":lib-json",
            ":api-data-store-server-java",
            ":api-data-store-server-javascript",
            ":api-openbis-typescript",
            ":test-integration",
            ":lib-rdf",
            ":docs",
            ":lib-ro-crate",
            ":app-ro-crate-openbis",
            ":app-migration",
            ":app-openbis-drive",
            ":app-openbis-command-line",
            ":test-app-openbis-installer",
            ":api-openbis-python3-pybis",
            ":release",
            ":lib-http",
            ":imaging-technology-sources",
            ":imaging-technology-dataset-interceptor",
            ":imaging-nanonis-adapters-sources",
            ":imaging-test-adapters-sources",
            ":server-ro-crate"
    ]
}
