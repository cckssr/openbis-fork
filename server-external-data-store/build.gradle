apply plugin: 'java-library'
apply plugin: 'application'

repositories {
    ivy {
        ivyPattern "https://sissource.ethz.ch/openbis/openbis-public/openbis-ivy/-/raw/BIS-2532-ivy-repository-refactoring-for-open-bis-7/[organisation]/[module]/[revision]/ivy.xml"
        artifactPattern "https://sissource.ethz.ch/openbis/openbis-public/openbis-ivy/-/raw/BIS-2532-ivy-repository-refactoring-for-open-bis-7/[organisation]/[module]/[revision]/[artifact]-[revision](-[classifier]).[ext]"
    }
    //mavenCentral()
}

dependencies {
    api project(':lib-microservice-server'), project(':lib-logging')
    api libs.openbis.openbis.v3.api.batteries.included
}

mainClassName = "ch.ethz.sis.microservices.download.server.startup.Main"

distZip {
    eachFile { file ->
        if (file.name.endsWith('-sources.jar') || file.name.endsWith('-javadoc.jar')) {
            file.exclude()
        }
    }
    into(project.name) {
        from './conf'
        include '*'
    }
    into(project.name) {
        from './'
        include 'README.md'
    }
}
