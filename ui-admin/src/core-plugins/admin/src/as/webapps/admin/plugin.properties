webapp-folder = ${admin.as.webapps.webapp-folder:html}
#
# Port of the server-sftp server. The "SFTP Link" in the Files widget reads it via
# getServerPublicInformation() to build sftp:// links; the host is taken from the browser's hostname.
# Default value: 2222
sftp-port = ${admin.as.webapps.sftp-port:2222}
