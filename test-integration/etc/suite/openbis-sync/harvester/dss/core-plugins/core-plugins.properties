# Dedicated DSS core-plugins descriptor for the openBIS sync suite.
# Enables the openbis-sync module: it provides the data-source servlet
# (/datastore_server/re-sync) and, importantly for the harvester, the 'openbis-db' data source.
# The plugin itself is symlinked in at runtime by OpenbisSyncIntegrationTestEnvironment.
enabled-modules = openbis-sync
