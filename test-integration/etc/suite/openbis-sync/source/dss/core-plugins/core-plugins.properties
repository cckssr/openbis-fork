# Dedicated DSS core-plugins descriptor for the openBIS sync SOURCE instance.
# Only the openbis-sync module is enabled: it provides the data-source servlet
# (/datastore_server/re-sync) and the 'openbis-db' data source the harvester pulls from.
# The plugin itself is symlinked in at runtime by OpenbisSyncIntegrationTestEnvironment.
enabled-modules = openbis-sync
